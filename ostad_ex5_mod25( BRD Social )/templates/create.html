{% extends "index.html" %}
{% load crispy_forms_tags %}

{% block content %}
    <h2>Create a Post</h2>
    <form class="container" method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form|crispy }} 
      <button type="submit" class="btn btn-primary">submit</button>
    </form>
{% endblock %}
