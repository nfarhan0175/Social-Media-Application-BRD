{% extends "index.html" %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-5" style="max-width: 400px;">
  <h3 class="text-center mb-4">Login</h3>

  <form method="POST" class="border p-4 shadow-sm bg-light rounded">
    {% csrf_token %}
    
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" name="uname" id="username" class="form-control" placeholder="Enter username" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" name="pass" id="password" class="form-control" placeholder="Enter password" required>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Login</button>
  </form>

  {% if messages %}
    <div class="mt-3">
      {% for message in messages %}
        <div class="alert alert-danger" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
</div>

{% endblock %}
