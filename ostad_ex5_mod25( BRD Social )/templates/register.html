{% extends "index.html" %}
{%load crispy_forms_tags %} 

{% block content %}

<div class="container mt-5" style="max-width: 500px;">
  <h3 class="text-center mb-4">Register</h3>

  <form method="POST" class="border p-4 shadow-sm bg-light rounded">
    {% csrf_token %}

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" class="form-control" required placeholder="Enter username">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" name="email" id="email" class="form-control" required placeholder="Enter email">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" class="form-control" required placeholder="Enter password">
    </div>

    <div class="form-group">
      <label for="confiorm password">Confirm Password</label>
      <input type="password" name="confirm_password" id="onfirm_password" class="form-control" required placeholder="Confirm password">
    </div>

    <button type="submit" class="btn btn-primary btn-block">Register</button>
  </form>

  {% if messages %}
    <div class="mt-3">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
</div>


{% endblock  %}
